services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-axion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axion_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-auth_axion}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-axion} -d ${POSTGRES_DB:-auth_axion}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: auth-axion-postgres-data
